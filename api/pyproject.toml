[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-project-api"
version = "0.1.0"
description = "Project management API (FastAPI) for tools-project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
