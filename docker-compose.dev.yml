# tools-project — Docker development
#
# Copy `.env.example` → `.env`, then set PUBLIC_HOST, WEB_DEV_HOST_PORT, API_HOST_PORT,
# POSTGRES_HOST_PORT, and derived URLs (or rely on the defaults in `.env.example`).
#
# API mounts repo ./sql at /sql (declarative schema; no Alembic — see .cursorrules).
#
# Full stack:
#   docker compose --profile dev up --build
#   → Web:  http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}
#   → API:  http://${PUBLIC_HOST:-localhost}:${API_HOST_PORT:-8300}/healthz
#   → Docs: http://${PUBLIC_HOST:-localhost}:${API_HOST_PORT:-8300}/docs
#
# CI-style (web lint + production build, no deps):
#   docker compose run --rm --no-deps web sh -lc "npm ci --no-audit --no-fund && npm run check && npm run build"

name: ${COMPOSE_PROJECT_NAME:-tools_project_dev}

services:
  postgresql:
    profiles:
      - dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prj_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tools_project}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - tpr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prj} -d ${POSTGRES_DB:-tools_project}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  api:
    profiles:
      - dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: tpr_api_${COMPOSE_PROJECT_NAME:-tools_project_dev}
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://prj:prj_dev_change_me@postgresql:5432/tools_project}
      SQL_SCHEMA_DIR: ${SQL_SCHEMA_DIR:-/sql}
      SQL_SCHEMA_APPLY: ${SQL_SCHEMA_APPLY:-true}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/data/attachments}
      ATTACHMENT_RETENTION_DAYS: ${ATTACHMENT_RETENTION_DAYS:-0}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change_me_generate_a_long_random_secret}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-dev-bootstrap-change-me}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
      OAUTH_USER_INFO_ENDPOINT: ${OAUTH_USER_INFO_ENDPOINT:-https://dev.aiepic.app/api/users/me}
    ports:
      - "${API_HOST_PORT:-8300}:8300"
    volumes:
      - ./api:/app
      - ./sql:/sql:ro
      - tpr_attachments:/data/attachments
    working_dir: /app
    depends_on:
      postgresql:
        condition: service_healthy
    extra_hosts:
      - "dev.aiepic.app:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - internal

  web:
    profiles:
      - dev
    networks:
      - internal
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: tpr_web_${COMPOSE_PROJECT_NAME:-tools_project_dev}
    ports:
      - "${WEB_DEV_HOST_PORT:-18513}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    working_dir: /app
    environment:
      PORT: "3000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}}
      WATCHPACK_POLLING: "true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8300}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://${PUBLIC_HOST:-localhost}:${API_HOST_PORT:-8300}}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-project_t1p2r3j4}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-change_me}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}/oauth/complete}
      OAUTH_TOKEN_ENDPOINT: ${OAUTH_TOKEN_ENDPOINT:-https://dev.aiepic.app/oauth/token}
      OAUTH_USER_INFO_ENDPOINT: ${OAUTH_USER_INFO_ENDPOINT:-https://dev.aiepic.app/api/users/me}
      NEXT_PUBLIC_OAUTH_AUTHORIZATION_ENDPOINT: ${NEXT_PUBLIC_OAUTH_AUTHORIZATION_ENDPOINT:-https://dev.aiepic.app/oauth/authorize}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-profile email}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-prj_auth}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-prj_refresh}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-true}
    extra_hosts:
      - "dev.aiepic.app:host-gateway"
      - "host.docker.internal:host-gateway"
    command: sh -lc "npm ci --no-audit --no-fund && npm run dev"
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Explicit Docker volume names include COMPOSE_PROJECT_NAME so clones/sandboxes stay isolated
  # when COMPOSE_PROJECT_NAME is unique (see .env.example / bin/start.sh).
  web_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_dev}_web_node_modules
  tpr_pg_data:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_dev}_tpr_pg_data
  tpr_attachments:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_dev}_tpr_attachments

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_dev}_internal
