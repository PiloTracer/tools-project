name: framework-verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run framework-verify (skill count, registration, intake contract, verifier + token-lint self-tests, bootstrap-test, lean gate)
        run: bash scripts/framework-verify.sh

      - name: Probe ledger honesty (no-op if no PROBE_LEDGER.md)
        run: bash scripts/readiness-verify.sh

      - name: Screen↔SPEC↔milestone traceability (no-op if no screen map)
        run: bash scripts/traceability-verify.sh

      - name: Adopter first-run bootstrap integration
        run: bash scripts/bootstrap-test.sh
