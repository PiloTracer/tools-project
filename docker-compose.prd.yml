# tools-project — Docker production
#
# Copy `.env.example` → `.env.prd`, then set secrets, hosts, and ports.
#
# Usage:
#   ./bin/start.sh prd          # interactive menu
#   docker compose -f docker-compose.prd.yml --env-file .env.prd up -d --build
#
# Services:
#   → Web:  http://${PUBLIC_HOST}:${WEB_PORT:-80}
#   → API:  http://${PUBLIC_HOST}:${API_PORT:-8300}/healthz
#   → Docs: http://${PUBLIC_HOST}:${API_PORT:-8300}/docs

name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prd}
      POSTGRES_DB: ${POSTGRES_DB:-tools_project}
    volumes:
      - tpr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:-tools_project}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prd
    container_name: tpr_api_${COMPOSE_PROJECT_NAME:-tools_project_prd}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prd}
      SQL_SCHEMA_DIR: ${SQL_SCHEMA_DIR:-/sql}
      SQL_SCHEMA_APPLY: ${SQL_SCHEMA_APPLY:-true}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/data/attachments}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-false}
      AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prd}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}}
      OAUTH_USER_INFO_ENDPOINT: ${OAUTH_USER_INFO_ENDPOINT:-}
      GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED:-false}
      GITHUB_POLL_INTERVAL_SECONDS: ${GITHUB_POLL_INTERVAL_SECONDS:-300}
      GITHUB_POLL_INITIAL_DELAY_SECONDS: ${GITHUB_POLL_INITIAL_DELAY_SECONDS:-10}
      GITHUB_COMMITS_PER_SYNC: ${GITHUB_COMMITS_PER_SYNC:-100}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - ./sql:/sql:ro
      - tpr_attachments:/data/attachments
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prd
    container_name: tpr_web_${COMPOSE_PROJECT_NAME:-tools_project_prd}
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://${PUBLIC_HOST:-localhost}:${WEB_DEV_HOST_PORT:-18513}}
      API_INTERNAL_URL: http://api:8300
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env.prd}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      OAUTH_TOKEN_ENDPOINT: ${OAUTH_TOKEN_ENDPOINT:-}
      OAUTH_USER_INFO_ENDPOINT: ${OAUTH_USER_INFO_ENDPOINT:-}
      NEXT_PUBLIC_OAUTH_AUTHORIZATION_ENDPOINT: ${NEXT_PUBLIC_OAUTH_AUTHORIZATION_ENDPOINT:-}
      OAUTH_PKCE_STATE_SECRET: ${OAUTH_PKCE_STATE_SECRET:-}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-profile email}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-prj_auth}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-prj_refresh}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-false}
      AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: tpr_caddy_${COMPOSE_PROJECT_NAME:-tools_project_prd}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prd}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - internal

volumes:
  tpr_pg_data:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}_tpr_pg_data
  tpr_attachments:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}_tpr_attachments
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}_caddy_config

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-tools_project_prd}_internal
